[project]
name = "mcp-vs-code-mode"
version = "0.1.0"
description = "Benchmark: classic MCP tool calling vs. 'code mode' (LLM writes code against an MCP-generated API) using a LangGraph agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-quickjs>=0.4.0",
    "langgraph>=1.2.24",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
bench-seed = "bench.seed_notion:main"
bench-run = "bench.runner:main"
bench-report = "bench.report:main"
bench-stats = "bench.stats:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
